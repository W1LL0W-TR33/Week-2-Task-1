<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — Week 2</title>
  <link rel="stylesheet" href="styles.css" />
  <!-- defer = download now, run after the whole page is parsed.
       Two files, loaded in order: Monday's work, then Wednesday's.
       You never edit this file. -->
  <script src="app.js" defer></script>
  <script src="widgets.js" defer></script>
</head>
<body>
  <header>
    <h1 id="title">William Thang</h1>
    <p class="tagline">Year 2 · Web and Mobile Application Development</p>
  </header>

  <main>
    <!-- ============ Used from meeting 1 (Lab 3) onwards ============ -->
    <section id="about">
      <h2>About me</h2>
      <p>I like learning new things and exploring new places.</p>
      <img id="photo" src="src/images/profile.jpg" alt="A photo of me" width="180" />
    </section>

    <section id="skills-section">
      <h2>Skills</h2>

      <!-- Meeting 2 adds this form. On Monday it just sits there doing nothing:
           that is the point — HTML alone cannot react to anything. -->
      <form id="addForm">
        <input id="skillField" placeholder="Add a skill" autocomplete="off" />
        <button>Add</button>
      </form>

      <!-- Deliberately empty: meeting 1 step 6 fills this from an array. -->
      <ul id="skills"></ul>

      <button id="clearAll">Clear all</button>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Email: you@example.com</p>
    </section>

    <!-- ============ Added in meeting 2 (S7) ============ -->
    <section id="counter">
      <h2>Counter</h2>
      <p id="countDisplay">0</p>
      <button id="up">+1</button>
      <button id="down">-1</button>
      <button id="reset">Reset</button>
    </section>

    <section id="typing">
      <h2>Character counter</h2>
      <input id="nameField" placeholder="Type your name" autocomplete="off" />
      <p id="count">0 characters</p>
    </section>
  </main>

  <footer>
    <p>Built in week 1. Made to move in week 2.</p>
  </footer>
</body>
</html>
